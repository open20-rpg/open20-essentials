name: release

# Releases are automated on every push to `main` with the shared Open20 release
# actions (https://github.com/open20-rpg/open20-release): if any commit since
# the last tag is visible to users, it writes the new version into the pack
# manifest, build.py and package.json, packs pack/ into the .dungeondraft_pack,
# commits the version back as `chore(release): vX.Y.Z [skip ci]`, tags it and
# creates the GitHub Release with two copies of the pack:
#   Open20-Essentials.dungeondraft_pack   fixed name, for the "latest" link:
#     https://github.com/<repo>/releases/latest/download/Open20-Essentials.dungeondraft_pack
#   open20-essentials-X.Y.Z.dungeondraft_pack
# Then the Open20 bot announces it on Discord (the organization's
# DISCORD_BOT_TOKEN secret; without it nothing is announced).
#
# To (re)publish the pack of an existing tag, run this workflow by hand with
# `republish` set to its version: it creates the release if it's missing.

on:
  workflow_dispatch:
    inputs:
      republish:
        description: "Publish the pack of an existing tag (version, e.g. 2.2.0) instead of releasing"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: inputs.republish == '' || inputs.republish == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: open20-rpg/open20-release/release@v1
        id: release
        with:
          npm: "true"
          prepare: node scripts/bump-version.mjs ${nextRelease.version} && node scripts/pack.mjs
          commit-assets: |
            pack/open20-essentials.json
            scripts/build.py
          release-assets: |
            dist/Open20-Essentials.dungeondraft_pack # Open20-Essentials.dungeondraft_pack (última versión)
            dist/open20-essentials-*.dungeondraft_pack
      # The pack is on the release from the start: nothing to wait for.
      - uses: open20-rpg/open20-release/discord-announce@v1
        if: steps.release.outputs.tag != ''
        with:
          tag: ${{ steps.release.outputs.tag }}
          title: Open20 Essentials
          download: https://open20.app/essentials
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}

  republish:
    if: inputs.republish != '' && inputs.republish != null
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ inputs.republish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.republish }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/pack.mjs
      - name: upload to the release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Open20 Essentials $TAG."
          gh release upload "$TAG" dist/*.dungeondraft_pack --clobber
